services:
  spotlib:
    build: .
    container_name: spotlib
    restart: unless-stopped
    env_file: .env
    environment:
      TRUSTED_PROXIES: "127.0.0.1,::1,172.30.0.1"
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./cache:/app/cache
      - ./spotify_credentials.json:/app/spotify_credentials.json
      - ./spotify_oauth.json:/app/spotify_oauth.json
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    networks: [default]

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
